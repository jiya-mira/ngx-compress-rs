[package]
name = "ngx-compress-codecs"
description = "Streaming codec adapters for ngx-compress-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ngx-compress-core = { path = "../ngx-compress-core" }
flate2 = { version = "1", optional = true, default-features = false }
brotli = { version = "8", optional = true, default-features = false }
zstd = { version = "0.13", optional = true }
# System libbrotli FFI adapter, used only for `br` in the system-libs backend.
ngx-compress-brotli-sys = { path = "../ngx-compress-brotli-sys", optional = true }

[dev-dependencies]
# Decoders used by the round-trip integration tests to verify output.
flate2 = "1"
brotli = "8"
zstd = "0.13"

# Two orthogonal dimensions, both build-time:
#   1. Which codings: gzip / deflate / brotli / zstd (identity is always on).
#   2. Backend: `vendored` (default, self-compiled with SIMD/vectorized paths)
#      xor `system-libs` (Stage B: link the distro's shared libraries).
# The two backends are mutually exclusive to keep the build matrix flat.
[features]
default = ["vendored"]
gzip = ["dep:flate2"]
deflate = ["dep:flate2"]
brotli = ["dep:brotli"]
zstd = ["dep:zstd"]
# Self-compiled backends with their high-value performance features enabled.
# zlib-ng (gzip/deflate) and libzstd carry their own SIMD paths on stable. The
# brotli crate's `simd` feature needs nightly (portable_simd), so on stable we
# enable only its stable `vector_scratch_space` fast path.
#
# zstd's `fat-lto` is intentionally NOT enabled: it compiles libzstd to LTO
# bitcode objects that NGINX's plain linker cannot resolve when it links our
# staticlib (undefined ZSTD_* symbols). Cargo's profile `lto = "fat"` still
# applies to the Rust crates; the C lib stays as ordinary objects.
vendored = [
    "flate2?/zlib-ng",
    "brotli?/std",
    "brotli?/vector_scratch_space",
]
# Link the distro's prebuilt shared libraries instead of compiling them:
# flate2 -> system libz, zstd -> system libzstd (pkg-config), and `br` through
# the system-libbrotli FFI adapter (linked with -lbrotlienc by the NGINX build).
# Mutually exclusive with `vendored`.
system-libs = [
    "flate2?/zlib",
    "zstd?/pkg-config",
    "dep:ngx-compress-brotli-sys",
]

[lints]
workspace = true
