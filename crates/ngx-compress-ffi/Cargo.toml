[package]
name = "ngx-compress-ffi"
description = "Isolated NGINX FFI boundary for ngx-compress-rs (filter chain plumbing)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
ngx = "0.5"

# Boundary crate: unsafe is permitted here and forbidden in core/codecs. Every
# unsafe block documents its invariant with a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
