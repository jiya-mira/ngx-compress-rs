[workspace]
resolver = "3"
members = [
    "crates/ngx-compress-core",
    "crates/ngx-compress-codecs",
    "crates/ngx-compress-ffi",
    "crates/ngx-compress-module",
]
# The nginx-linked crates need an NGINX source tree to build, so the default
# set keeps `cargo test`/`clippy` on the host hermetic and fast. The ffi and
# module crates are built explicitly inside the Docker environment.
default-members = [
    "crates/ngx-compress-core",
    "crates/ngx-compress-codecs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Release builds favor speed. NOTE: the NGINX buildsystem compiles through the
# `ngx-release` profile (inherits `release`), so lto/opt-level/codegen-units
# apply there too; auto/rust forces `strip = "none"` for that flow, so `strip`
# below only affects standalone cargo builds.
[profile.release]
lto = "fat"
opt-level = 3
strip = "symbols"
codegen-units = 1

