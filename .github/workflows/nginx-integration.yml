name: NGINX integration

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration_matrix:
    name: NGINX integration / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare diagnostics
        run: mkdir -p artifacts

      - name: Build exact Bookworm toolchain
        run: |
          set -o pipefail
          docker build -f docker/Dockerfile -t ngx-compress-build:ci . 2>&1 \
            | tee artifacts/docker-build.log

      - name: Dynamic/static integration and filter coexistence
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" ngx-compress-build:ci \
            sh /repo/docker/build-and-test.sh 2>&1 | tee artifacts/integration.log

      - name: Dynamic/static by vendored/system backend
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" ngx-compress-build:ci \
            sh /repo/docker/verify-backends.sh 2>&1 | tee artifacts/backends.log

      - name: Edge and Test::Nginx suites
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" ngx-compress-build:ci \
            sh /repo/docker/edge-tests.sh 2>&1 | tee artifacts/edge.log
          docker run --rm -v "$PWD:/repo" ngx-compress-build:ci \
            sh /repo/docker/test-nginx.sh 2>&1 | tee artifacts/test-nginx.log

      - name: Fault injection, reload, and five-minute soak
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" ngx-compress-build:ci \
            sh /repo/docker/lifecycle-tests.sh 2>&1 | tee artifacts/lifecycle.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nginx-integration-diagnostics-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  integration:
    name: NGINX integration / integration
    if: ${{ always() }}
    needs: integration_matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Require every architecture
        env:
          MATRIX_RESULT: ${{ needs.integration_matrix.result }}
        run: test "$MATRIX_RESULT" = success
