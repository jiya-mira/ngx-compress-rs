name: Security and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit to audit for the release gate
        required: false
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: security-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security and release / security
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: Install CycloneDX generator
        run: cargo install --locked cargo-cyclonedx --version 0.5.9

      - name: Generate vendored and system SBOMs
        run: |
          mkdir -p artifacts/sbom
          cargo cyclonedx --manifest-path crates/ngx-compress-module/Cargo.toml \
            --format json --override-filename ngx-compress-rs-0.1.1-vendored.cdx
          cargo cyclonedx --manifest-path crates/ngx-compress-module/Cargo.toml \
            --format json --no-default-features \
            --features 'gzip,deflate,brotli,zstd,system-libs' \
            --override-filename ngx-compress-rs-0.1.1-system.cdx
          find crates/ngx-compress-module -maxdepth 1 -name 'ngx-compress-rs-0.1.1-*.cdx.json' \
            -exec cp {} artifacts/sbom/ \;
          test "$(find artifacts/sbom -name '*.cdx.json' | wc -l)" -eq 2
          scripts/toolchain-manifest.sh artifacts/sbom/toolchain.txt

      - name: Build diagnostic image
        run: docker build -f docker/Dockerfile -t ngx-compress-build:security .

      - name: ASan/UBSan and Valgrind
        run: |
          docker run --rm -v "$PWD:/repo" ngx-compress-build:security sh -c '
            rustup toolchain install nightly-2026-07-01 --profile minimal
            DIAGNOSTIC_DIR=/repo/artifacts/security \
              RUSTUP_TOOLCHAIN=nightly-2026-07-01 sh /repo/docker/sanitizer-tests.sh
          '
          docker run --rm -v "$PWD:/repo" \
            -e DIAGNOSTIC_DIR=/repo/artifacts/security \
            ngx-compress-build:security sh /repo/docker/valgrind-tests.sh

      - name: Upload SBOM and toolchain inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  rehearsal:
    name: Security and release / rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Source artifact rehearsal
        run: scripts/package-release.sh

      - name: Upload source rehearsal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-rehearsal-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release-gate:
    name: Security and release / release-gate
    if: github.event_name == 'workflow_dispatch' && inputs.target_sha != ''
    needs: [security, rehearsal]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out gate script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require all checks on the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release-checks.sh '${{ inputs.target_sha }}'
